<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة التعاميم والتوقيعات</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap');

:root{
  --bg:#F6F3EC;
  --paper:#FFFFFF;
  --paper-line:#E4DECB;
  --ink:#1C2B2E;
  --ink-soft:#5C6C6E;
  --ink-faint:#8B978F;
  --primary:#2F5D5A;
  --primary-dark:#1E3E3C;
  --primary-tint:#E7EFEC;
  --gold:#AD8A4E;
  --gold-tint:#F3ECDC;
  --success:#3E7A54;
  --success-bg:#E7F2EA;
  --danger:#A64B3E;
  --danger-bg:#F8EAE7;
  --radius:12px;
  --shadow:0 3px 14px rgba(28,43,46,.08);
  --shadow-lift:0 10px 30px rgba(28,43,46,.16);
  --font-display:'Amiri', serif;
  --font-body:'Tajawal', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  background-image:
    radial-gradient(circle at 100% 0%, rgba(173,138,78,.06), transparent 40%),
    radial-gradient(circle at 0% 100%, rgba(47,93,90,.06), transparent 40%);
  font-family:var(--font-body);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:var(--font-display);}
button{font-family:var(--font-body);}
::selection{background:var(--gold-tint);}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

#app{max-width:1040px; margin:0 auto; padding:22px 18px 70px;}

/* ===== Top bar ===== */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px; background:var(--paper); border:1px solid var(--paper-line);
  border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:20px; gap:12px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:12px;}
.brand-seal{
  width:42px; height:42px; border-radius:50%; border:2px double var(--gold);
  display:flex; align-items:center; justify-content:center; color:var(--primary-dark); font-size:16px; flex-shrink:0;
  background:var(--gold-tint);
}
.brand-text .org-name{font-weight:700; font-size:15px; color:var(--primary-dark); display:flex; align-items:center; gap:6px;}
.brand-text .sub{font-size:12px; color:var(--ink-faint);}
.edit-org-btn{background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:11px; padding:2px;}
.edit-org-btn:hover{color:var(--primary);}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.sync-status{font-size:11px; color:var(--ink-faint); display:flex; align-items:center; gap:5px; font-family:var(--font-mono);}
.sync-dot{width:7px; height:7px; border-radius:50%; background:var(--success); flex-shrink:0;}
.sync-dot.bad{background:var(--danger);}
.icon-btn{
  border:1px solid var(--paper-line); background:var(--paper); color:var(--ink-soft);
  border-radius:8px; width:34px; height:34px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:.15s;
}
.icon-btn:hover{background:var(--primary-tint); color:var(--primary-dark); border-color:var(--primary);}
.icon-btn.spinning i{animation:spin 0.7s linear;}
@keyframes spin{to{transform:rotate(360deg);}}
.labeled-btn{
  border:1px solid var(--primary); background:var(--primary-tint); color:var(--primary-dark);
  border-radius:8px; padding:9px 14px; font-size:13px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; gap:7px; transition:.15s; white-space:nowrap;
}
.labeled-btn:hover{background:var(--primary); color:#fff;}
.labeled-btn i{font-size:13px;}
.labeled-btn .btn-text{display:inline;}
@media (max-width:760px){
  .topbar{flex-wrap:wrap;}
  .topbar-actions{flex-wrap:wrap; width:100%; justify-content:flex-start;}
}
.logout-btn{
  border:1px solid var(--paper-line); background:var(--paper); color:var(--danger);
  border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px;
}
.logout-btn:hover{background:var(--danger-bg);}

/* ===== Banners / toasts ===== */
.banner{
  padding:12px 16px; border-radius:10px; font-size:13.5px; margin-bottom:16px;
  display:flex; align-items:center; gap:10px; border:1px solid transparent;
}
.banner.error{background:var(--danger-bg); color:var(--danger); border-color:#e6c9c2;}
.banner.info{background:var(--primary-tint); color:var(--primary-dark); border-color:#cfe0dc;}
.toast-wrap{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:999; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{
  background:var(--ink); color:#fff; padding:11px 20px; border-radius:30px; font-size:13.5px;
  box-shadow:var(--shadow-lift); display:flex; align-items:center; gap:8px; animation:toastIn .25s ease-out;
  white-space:nowrap;
}
.toast.success{background:var(--primary-dark);}
.toast.error{background:var(--danger);}
@keyframes toastIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

/* ===== Landing ===== */
.landing{padding:50px 10px 30px; text-align:center;}
.landing-seal{
  width:78px; height:78px; margin:0 auto 18px; border-radius:50%; border:3px double var(--gold);
  display:flex; align-items:center; justify-content:center; color:var(--primary-dark); font-size:30px; background:var(--gold-tint);
}
.landing h1{font-size:30px; color:var(--primary-dark); margin:0 0 8px;}
.landing p.lead{color:var(--ink-soft); font-size:15px; max-width:440px; margin:0 auto 40px; line-height:1.9;}
.role-grid{display:flex; gap:18px; justify-content:center; flex-wrap:wrap;}
.role-card{
  width:230px; background:var(--paper); border:1px solid var(--paper-line); border-radius:var(--radius);
  padding:30px 20px; cursor:pointer; transition:.18s; box-shadow:var(--shadow); text-align:center;
}
.role-card:hover{transform:translateY(-4px); box-shadow:var(--shadow-lift); border-color:var(--gold);}
.role-card i{font-size:30px; color:var(--primary); margin-bottom:14px;}
.role-card h3{margin:0 0 6px; font-size:17px; color:var(--ink);}
.role-card p{margin:0; font-size:12.5px; color:var(--ink-faint); line-height:1.7;}

/* ===== Employee login ===== */
.center-card{
  max-width:420px; margin:60px auto; background:var(--paper); border:1px solid var(--paper-line);
  border-radius:var(--radius); box-shadow:var(--shadow); padding:34px 28px; text-align:center;
}
.center-card i.top-icon{font-size:26px; color:var(--primary); margin-bottom:10px;}
.center-card h2{margin:0 0 6px; font-size:19px;}
.center-card p{color:var(--ink-faint); font-size:13px; margin:0 0 22px; line-height:1.8;}
.field{text-align:right; margin-bottom:16px;}
.field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; font-weight:500;}
.field .hint{font-size:11px; color:var(--ink-faint); margin-top:5px;}
input[type=text], input[type=date], textarea, select{
  width:100%; padding:11px 13px; border:1px solid var(--paper-line); border-radius:8px;
  font-family:var(--font-body); font-size:14px; color:var(--ink); background:#fff; transition:.15s;
}
input:focus, textarea:focus, select:focus{border-color:var(--primary); outline:none; box-shadow:0 0 0 3px var(--primary-tint);}
textarea{resize:vertical; min-height:70px;}
.btn{
  border:none; border-radius:9px; padding:12px 20px; font-size:14px; font-weight:700; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:.15s; width:100%;
}
.btn-primary{background:var(--primary-dark); color:#fff;}
.btn-primary:hover{background:var(--primary);}
.btn-primary:disabled{opacity:.55; cursor:not-allowed;}
.btn-ghost{background:transparent; color:var(--primary-dark); border:1px solid var(--paper-line);}
.btn-ghost:hover{background:var(--primary-tint);}
.err-text{color:var(--danger); font-size:12.5px; margin-top:6px; text-align:right; display:none;}

/* ===== Manager home ===== */
.section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
.section-head h2{font-size:19px; margin:0; color:var(--primary-dark); display:flex; align-items:center; gap:8px;}
.stats-row{display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
.stat-box{
  flex:1; min-width:140px; background:var(--paper); border:1px solid var(--paper-line); border-radius:10px;
  padding:14px 16px; box-shadow:var(--shadow);
}
.stat-box .num{font-family:var(--font-mono); font-size:22px; font-weight:600; color:var(--primary-dark);}
.stat-box .lbl{font-size:12px; color:var(--ink-faint); margin-top:2px;}

.doc-table-wrap{
  background:var(--paper); border:1px solid var(--paper-line); border-radius:var(--radius);
  box-shadow:var(--shadow); overflow:hidden;
}
table.doc-table{width:100%; border-collapse:collapse; font-size:13.5px;}
table.doc-table th{
  background:var(--primary-tint); color:var(--primary-dark); font-weight:700; text-align:right;
  padding:11px 12px; font-size:12.5px; border-bottom:1px solid var(--paper-line);
}
table.doc-table td{padding:12px; border-bottom:1px solid var(--paper-line); vertical-align:top; color:var(--ink);}
table.doc-table tbody tr{cursor:pointer; transition:.12s;}
table.doc-table tbody tr:hover{background:var(--gold-tint);}
table.doc-table tbody tr:last-child td{border-bottom:none;}
.subject-cell{max-width:230px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.badge-count{
  display:inline-flex; align-items:center; gap:5px; background:var(--success-bg); color:var(--success);
  padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700; font-family:var(--font-mono);
}
.badge-count.zero{background:var(--danger-bg); color:var(--danger);}
.row-actions{display:flex; gap:6px;}
.mini-btn{
  border:1px solid var(--paper-line); background:#fff; color:var(--ink-soft); border-radius:6px;
  width:28px; height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:12px;
}
.mini-btn:hover{background:var(--primary-tint); color:var(--primary-dark);}

.empty-state{
  text-align:center; padding:60px 20px; color:var(--ink-faint);
}
.empty-state i{font-size:32px; color:var(--paper-line); margin-bottom:14px; display:block;}
.empty-state p{margin:0 0 18px; font-size:14px;}

/* ===== Modal ===== */
.overlay{
  position:fixed; inset:0; background:rgba(28,43,46,.5); backdrop-filter:blur(2px);
  display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:500; overflow-y:auto;
}
.modal{
  background:var(--paper); border-radius:14px; box-shadow:var(--shadow-lift); width:100%; max-width:560px;
  padding:26px 26px 22px; animation:modalIn .18s ease-out;
}
@keyframes modalIn{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
.modal-head h3{margin:0; font-size:18px; color:var(--primary-dark);}
.modal-close{background:none; border:none; font-size:18px; color:var(--ink-faint); cursor:pointer;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:520px){.two-col{grid-template-columns:1fr;}}
.modal-actions{display:flex; gap:10px; margin-top:6px;}
.modal-actions .btn{width:auto; flex:1;}

/* ===== Doc detail (manager) ===== */
.detail-header{
  background:var(--paper); border:1px solid var(--paper-line); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:24px 26px; margin-bottom:18px;
}
.back-link{display:inline-flex; align-items:center; gap:6px; color:var(--ink-soft); font-size:13px; cursor:pointer; margin-bottom:14px; background:none; border:none; padding:0;}
.back-link:hover{color:var(--primary-dark);}
.detail-title{font-size:20px; color:var(--ink); margin:0 0 16px; line-height:1.6;}
.meta-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px 20px;}
@media (max-width:640px){.meta-grid{grid-template-columns:1fr 1fr;}}
.meta-item .k{font-size:11px; color:var(--ink-faint); margin-bottom:3px;}
.meta-item .v{font-size:13.5px; color:var(--ink); font-weight:500;}
.detail-actions{display:flex; gap:10px; margin-top:20px; flex-wrap:wrap;}
.detail-actions .btn{width:auto; padding:10px 18px;}

.sign-list{
  background:var(--paper); border:1px solid var(--paper-line); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:22px 26px;
}
.sign-list h3{margin:0 0 14px; font-size:15px; color:var(--primary-dark); display:flex; align-items:center; gap:8px;}
.signer-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--paper-line);}
.signer-row:last-child{border-bottom:none;}
.signer-seal{width:52px; height:52px; border-radius:50%; border:1.5px double var(--gold); display:flex; align-items:center; justify-content:center; color:var(--gold); font-size:16px; flex-shrink:0; background:var(--gold-tint); overflow:hidden; padding:3px;}
.signer-name{font-weight:600; font-size:13.5px; flex:1;}
.signer-time{font-size:11.5px; color:var(--ink-faint); font-family:var(--font-mono); direction:ltr;}

/* ===== Employee home ===== */
.emp-topinfo{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:10px; flex-wrap:wrap;}
.emp-name-chip{
  display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--paper-line);
  border-radius:30px; padding:8px 16px; font-size:13px; color:var(--primary-dark); font-weight:600; box-shadow:var(--shadow);
}
.emp-name-chip i{color:var(--gold);}

.circular-card{
  background:var(--paper); border:1px solid var(--paper-line); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:22px 24px; margin-bottom:16px; position:relative; overflow:hidden; transition:.4s;
}
.circular-card.stamping{pointer-events:none;}
.circular-card .top-row{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:10px;}
.doc-type-tag{
  display:inline-flex; align-items:center; gap:6px; background:var(--primary-tint); color:var(--primary-dark);
  font-size:11.5px; font-weight:700; padding:5px 12px; border-radius:20px;
}
.doc-date-tag{font-size:11.5px; color:var(--ink-faint); font-family:var(--font-mono); direction:ltr;}
.circular-card .subject{font-size:16px; font-weight:700; color:var(--ink); margin:6px 0 12px; line-height:1.7;}
.circular-meta{display:flex; gap:20px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-soft); margin-bottom:16px;}
.circular-meta span{display:flex; align-items:center; gap:6px;}
.circular-meta i{color:var(--gold); width:14px; text-align:center;}
.sign-cta{
  width:100%; border:1.5px solid var(--gold); background:var(--gold-tint); color:var(--primary-dark);
  border-radius:9px; padding:13px 16px; font-size:13.5px; font-weight:700; cursor:pointer; display:flex;
  align-items:center; justify-content:center; gap:10px; transition:.15s; line-height:1.6;
}
.sign-cta:hover{background:var(--gold); color:#fff; border-color:var(--gold);}
.sign-cta:disabled{opacity:.6; cursor:wait;}
.sign-cta i{font-size:15px;}

.stamp-overlay{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.88); opacity:0; pointer-events:none;
}
.circular-card.stamping .stamp-overlay{opacity:1; animation:overlayFade .9s ease-out forwards;}
@keyframes overlayFade{0%{opacity:0;}15%{opacity:1;}80%{opacity:1;}100%{opacity:0;}}
.stamp-graphic{
  width:96px; height:96px; border-radius:50%; border:4px double var(--success); color:var(--success);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  transform:scale(2.2) rotate(-18deg); opacity:0; font-weight:700; font-size:11px; text-align:center;
}
.circular-card.stamping .stamp-graphic{animation:stampHit .9s cubic-bezier(.2,.9,.3,1.3) forwards;}
@keyframes stampHit{0%{transform:scale(2.4) rotate(-18deg); opacity:0;}45%{transform:scale(.92) rotate(-6deg); opacity:1;}65%{transform:scale(1.05) rotate(-6deg);}100%{transform:scale(1) rotate(-6deg); opacity:1;}}
.stamp-graphic i{font-size:24px; margin-bottom:2px;}

.all-signed{
  text-align:center; padding:70px 20px; background:var(--paper); border:1px solid var(--paper-line);
  border-radius:var(--radius); box-shadow:var(--shadow); color:var(--ink-soft);
}
.all-signed i{font-size:38px; color:var(--success); margin-bottom:16px; display:block;}
.all-signed h3{margin:0 0 6px; color:var(--ink); font-size:17px;}
.all-signed p{margin:0; font-size:13px;}

.skeleton{background:var(--paper); border:1px solid var(--paper-line); border-radius:var(--radius); padding:22px 24px; margin-bottom:16px;}
.skeleton .bar{height:12px; background:linear-gradient(90deg,var(--paper-line),#f0ece0,var(--paper-line)); background-size:200% 100%; border-radius:6px; animation:shimmer 1.3s infinite;}
@keyframes shimmer{to{background-position:-200% 0;}}
.skeleton .bar.w40{width:40%; margin-bottom:14px;}
.skeleton .bar.w70{width:70%; margin-bottom:10px; height:16px;}
.skeleton .bar.w90{width:90%; height:36px; margin-top:14px;}

/* ===== Print area ===== */
#printArea{display:none;}
@media print{
  html, body{background:#ffffff !important;}
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block; position:absolute; top:0; right:0; left:0; padding:30px; background:#ffffff;}
  .print-header{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #1C2B2E; padding-bottom:14px; margin-bottom:20px;}
  .print-header .org{font-size:14px; font-weight:700;}
  .print-header .seal-mark{width:80px; height:80px; display:flex; align-items:center; justify-content:center;}
  .print-header .seal-mark img{max-width:100%; max-height:100%; object-fit:contain;}
  .print-title{font-size:20px; font-weight:700; margin-bottom:16px; font-family:var(--font-display);}
  .print-meta{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px 20px; margin-bottom:22px; font-size:12.5px;}
  .print-meta div span{display:block; color:#555; font-size:10.5px; margin-bottom:2px;}
  .print-table{width:100%; border-collapse:collapse; font-size:12.5px; background:#ffffff;}
  .print-table th{background:#eee; text-align:right; padding:8px; border:1px solid #ccc;}
  .print-table td{padding:8px; border:1px solid #ccc; background:#ffffff;}
  .print-footer{margin-top:26px; font-size:10.5px; color:#666; border-top:1px solid #ccc; padding-top:10px;}
}

@media (max-width:640px){
  .doc-table-wrap{overflow-x:auto;}
  table.doc-table{min-width:680px;}
}

/* ===== Employee picker (autocomplete) ===== */
.picker-wrap{position:relative; text-align:right;}
.picker-results{
  position:absolute; top:100%; right:0; left:0; margin-top:4px; background:#fff;
  border:1px solid var(--paper-line); border-radius:9px; box-shadow:var(--shadow-lift);
  max-height:220px; overflow-y:auto; z-index:50; text-align:right;
}
.picker-item{padding:11px 14px; cursor:pointer; border-bottom:1px solid var(--paper-line); display:flex; flex-direction:column; gap:2px;}
.picker-item:last-child{border-bottom:none;}
.picker-item:hover{background:var(--gold-tint);}
.picker-item .pname{font-size:13.5px; font-weight:600; color:var(--ink);}
.picker-item .pnote{font-size:11.5px; color:var(--ink-faint);}
.picker-empty{padding:14px; text-align:center; font-size:12.5px; color:var(--ink-faint);}
.selected-emp-chip{
  display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--success-bg); color:var(--success);
  border:1px solid #cfe4d6; border-radius:9px; padding:11px 14px; font-size:13.5px; font-weight:600; margin-top:8px;
}
.selected-emp-chip button{background:none; border:none; color:var(--success); cursor:pointer; font-size:12px; text-decoration:underline;}

/* ===== Field label above value (بشأن) ===== */
.field-label-inline{font-size:11px; color:var(--ink-faint); margin-bottom:4px; display:flex; align-items:center; gap:5px;}

/* ===== Employees roster modal ===== */
.roster-add-row{display:flex; gap:8px; margin-bottom:16px; align-items:flex-end;}
.roster-add-row .field{flex:1; margin-bottom:0;}
.roster-add-row .btn{width:auto; flex-shrink:0; padding:11px 16px;}
.roster-list{max-height:320px; overflow-y:auto; border-top:1px solid var(--paper-line);}
.roster-row{display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--paper-line);}
.roster-row .rname{font-weight:600; font-size:13.5px; flex:1;}
.roster-row .rnote{font-size:11.5px; color:var(--ink-faint);}
.roster-del{background:none; border:none; color:var(--danger); cursor:pointer; padding:6px; font-size:13px;}

<script type="module">
/* =========================================================
   منصة التعاميم والتوقيعات — Firebase Firestore + مزامنة لحظية
   التوقيع مرتبط بمعرّف موظفة فريد (وليس بمطابقة نصّية للاسم)

========================================================= */

  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
  createUserWithEmailAndPassword, updatePassword, sendPasswordResetEmail

import {

  query, where, serverTimestamp, enableIndexedDbPersistence
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBF7_7KbILq8IpgzcOTZdBK383Ukh89770",
  authDomain: "twqia-hissah.firebaseapp.com",
  projectId: "twqia-hissah",
  storageBucket: "twqia-hissah.firebasestorage.app",
  messagingSenderId: "573774513198",
  appId: "1:573774513198:web:3bf5d09455366b7d0c8bbf"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);
const MANAGER_EMAIL = "hessahsaqar@gmail.com";

// تطبيق Firebase ثانوي منفصل: يُستخدم فقط لإنشاء حسابات الموظفات
// حتى لا تتأثر جلسة دخول المديرة الحالية بعملية إنشاء الحساب

try{ enableIndexedDbPersistence(db); }catch(e){ /* التخزين المؤقت المحلي غير متاح، لا يؤثر على عمل النظام */ }

const AR_DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DOC_TYPES = ['تعميم','قرار إداري','إشعار','تعليمات','خطاب رسمي','لائحة','أخرى'];

const state = {
  view:'landing',        // landing | employeeLogin | employeeHome | managerHome | managerDetail
  employeeId:null,
  employeeName:null,
  docs:[],
  archivedDocs:[],
  roster:[],              // قائمة الموظفات المعتمدات {id, name, note}
  currentDocId:null,
  loading:true,
  storageOk:true,
  orgName:'الجهة',
  modal:null,             // 'addDoc' | 'editOrg' | 'roster' | null
  formError:'',
  pickerQuery:'',
  pickerSelectedId:null,
  pickerSelectedName:'',
  newEmployeeCreated:null,
  sessionPasswords:[],
  editingDocId:null,
  signatureUpdateMode:false,
};

const sigData = {};
const sigUnsubs = {};
const animatingIds = new Set();
let unsubDocs = null;
let unsubArchivedDocs = null;
let unsubOrg = null;
let unsubRoster = null;

/* ---------------- أدوات مساعدة ---------------- */
function pad(n){ return String(n).padStart(2,'0'); }
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function addDays(dateStr, delta){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+delta);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function formatDateAr(dateStr){
  if(!dateStr) return '—';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return dateStr;
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
}
function arDayName(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return '—';
  return AR_DAYS[d.getDay()];
}
function formatTimeAr(iso){
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  let h = d.getHours(); const m = pad(d.getMinutes());
  const ampm = h>=12 ? 'م':'ص';
  h = h%12; if(h===0) h=12;
  return `${formatDateAr(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`)} — ${pad(h)}:${m} ${ampm}`;
}
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function employeeUnsignedDocs(){
  return state.docs.filter(d => !d.signatures.some(s => s.employeeId === state.employeeId));
}
function docById(id){ return state.docs.find(d=>d.id===id) || state.archivedDocs.find(d=>d.id===id); }
function tsToIso(ts){
  try{ return ts && ts.toDate ? ts.toDate().toISOString() : new Date().toISOString(); }
  catch(e){ return new Date().toISOString(); }
}

/* ---------------- طبقة البيانات: Firestore ---------------- */
function attachOrgListener(){
  if(unsubOrg) unsubOrg();
  unsubOrg = onSnapshot(doc(db,'settings','org'), (snap)=>{
    state.storageOk = true;
    if(snap.exists() && snap.data().name) state.orgName = snap.data().name;
    safeRender();
  }, ()=>{});
}

function attachRosterListener(){
  if(unsubRoster) unsubRoster();
  unsubRoster = onSnapshot(collection(db,'employees'), (snap)=>{
    const list = [];
    snap.forEach(d=> list.push(Object.assign({id:d.id}, d.data())));
    list.sort((a,b)=> (a.name||'').localeCompare(b.name||'', 'ar'));
    state.roster = list;
    safeRender();
    if(typeof tryResumeEmployeeSession === 'function') tryResumeEmployeeSession();
  }, (err)=>{ console.error(err); });
}

function cleanupOrphanSigListeners(){
  const validIds = new Set([
    ...state.docs.map(d=>d.id),
    ...state.archivedDocs.map(d=>d.id),
  ]);
  Object.keys(sigUnsubs).forEach(id=>{
    if(!validIds.has(id)){ sigUnsubs[id](); delete sigUnsubs[id]; delete sigData[id]; }
  });
}

function attachDocsListener(){
  stopDocListeners();
  state.loading = true;
  const q = query(collection(db,'documents'), where('archived','==', false));
  unsubDocs = onSnapshot(q, (snapshot)=>{
    state.storageOk = true;
    const docs = [];
    snapshot.forEach(d=>{
      const data = d.data();
      docs.push(Object.assign({id:d.id}, data, {
        createdAt: tsToIso(data.createdAt),
        signatures: sigData[d.id] || []
      }));
      if(!sigUnsubs[d.id]) attachSigListener(d.id);
    });
    docs.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
    state.docs = docs;
    state.loading = false;
    cleanupOrphanSigListeners();
    safeRender();
  }, (err)=>{
    console.error(err); state.storageOk = false; state.loading = false; safeRender();
  });
}

function attachArchivedDocsListener(){
  if(unsubArchivedDocs) unsubArchivedDocs();
  const q = query(collection(db,'documents'), where('archived','==', true));
  unsubArchivedDocs = onSnapshot(q, (snapshot)=>{
    state.storageOk = true;
    const docs = [];
    snapshot.forEach(d=>{
      const data = d.data();
      docs.push(Object.assign({id:d.id}, data, {
        createdAt: tsToIso(data.createdAt),
        signatures: sigData[d.id] || []
      }));
      if(!sigUnsubs[d.id]) attachSigListener(d.id);
    });
    docs.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
    state.archivedDocs = docs;
    cleanupOrphanSigListeners();
    safeRender();
  }, (err)=>{ console.error(err); });
}

function attachSigListener(docId){
  const ref = collection(db,'documents',docId,'signatures');
  sigUnsubs[docId] = onSnapshot(ref, (snap)=>{
    const sigs = [];
    snap.forEach(s=>{
      const d = s.data();
      sigs.push({employeeId: d.employeeId, employeeName: d.employeeName, signedAt: tsToIso(d.signedAt)});
    });
    sigs.sort((a,b)=> new Date(a.signedAt)-new Date(b.signedAt));
    sigData[docId] = sigs;
    const target = state.docs.find(x=>x.id===docId) || state.archivedDocs.find(x=>x.id===docId);
    if(target) target.signatures = sigs;
    safeRender();
  }, (err)=>{ console.error(err); });
}

function stopDocListeners(){
  if(unsubDocs){ unsubDocs(); unsubDocs=null; }
  if(unsubArchivedDocs){ unsubArchivedDocs(); unsubArchivedDocs=null; }
  Object.keys(sigUnsubs).forEach(id=>{ sigUnsubs[id](); delete sigUnsubs[id]; });
  Object.keys(sigData).forEach(id=> delete sigData[id]);
  state.archivedDocs = [];
}

async function createDoc(payload){
  try{
    const ref = await addDoc(collection(db,'documents'), Object.assign({}, payload, {
      createdAt: serverTimestamp(), archived:false
    }));
    return ref.id;
  }catch(e){ console.error(e); return null; }
}
async function editDocument(id, payload){
  try{
    const updateData = Object.assign({}, payload);
    if(!('imageUrl' in updateData)) updateData.imageUrl = deleteField();
    if(!('attachmentType' in updateData)) updateData.attachmentType = deleteField();
    await updateDoc(doc(db,'documents',id), updateData);
    return true;
  }catch(e){ console.error(e); return false; }
}
async function archiveDoc(docId){
  try{ await updateDoc(doc(db,'documents',docId), {archived:true}); return true; }
  catch(e){ console.error(e); return false; }
}
async function restoreDoc(docId){
  try{ await updateDoc(doc(db,'documents',docId), {archived:false}); return true; }
  catch(e){ console.error(e); return false; }
}
async function signDocument(docId, employeeId, employeeName){
  try{
    await setDoc(doc(db,'documents',docId,'signatures',employeeId), {
      employeeId, employeeName, signedAt: serverTimestamp()
    });
    return true;
  }catch(e){ console.error(e); return false; }
}
async function saveOrgName(name){
  try{ await setDoc(doc(db,'settings','org'), {name}, {merge:true}); return true; }
  catch(e){ console.error(e); return false; }
}
function generatePassword(len){
  len = len || 8;
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  return Array.from(arr, n => chars[n % chars.length]).join('');
}
function generateInternalEmail(){
  const rand = Math.random().toString(36).slice(2,10);
  return `emp-${Date.now().toString(36)}${rand}@tawqia-internal.app`;
}

// تكتشف الأخطاء الإملائية الشائعة بأسماء مزوّدي البريد المعروفين (مثل gmail.con بدل gmail.com)
// وترجع اقتراح التصحيح الكامل، أو null إذا ما فيه شك بخطأ إملائي.
function findEmailDomainTypo(email){
  const at = email.lastIndexOf('@');
  if(at === -1) return null;
  const local = email.slice(0, at);
  const domain = email.slice(at+1).toLowerCase();
  const typoMap = {
    'gmail.con':'gmail.com', 'gmial.com':'gmail.com', 'gmai.com':'gmail.com',
    'gmail.co':'gmail.com', 'gmaill.com':'gmail.com', 'gmail.cm':'gmail.com',
    'gmail.comm':'gmail.com', 'gnail.com':'gmail.com', 'gmail.copm':'gmail.com',
    'hotmail.con':'hotmail.com', 'hotmial.com':'hotmail.com', 'hotmai.com':'hotmail.com',
    'hotmail.co':'hotmail.com', 'hotnail.com':'hotmail.com',
    'outlook.con':'outlook.com', 'outlok.com':'outlook.com', 'outlook.co':'outlook.com',
    'yahoo.con':'yahoo.com', 'yaho.com':'yahoo.com', 'yahoo.co':'yahoo.com', 'yahou.com':'yahoo.com',
    'icloud.con':'icloud.com', 'iclod.com':'icloud.com', 'icloud.co':'icloud.com',
  };
  if(typoMap[domain]){
    return local + '@' + typoMap[domain];
  }
  return null;
}

async function addRosterEmployee(name, note, realEmail){
  const password = generatePassword();
  const useRealEmail = !!(realEmail && realEmail.trim());
  const email = useRealEmail ? realEmail.trim() : generateInternalEmail();
  try{
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
    const uid = cred.user.uid;
    let emailSent = false;
    if(useRealEmail){
      try{
        await sendPasswordResetEmail(secondaryAuth, email);
        emailSent = true;
      }catch(e3){ console.error(e3); /* الحساب أُنشئ رغم فشل الإرسال؛ نعرض كلمة المرور كخطة بديلة */ }
    }
    try{ await signOut(secondaryAuth); }catch(e2){ /* تنظيف بسيط، لا يؤثر على النتيجة */ }
    const payload = { name, authEmail: email, createdAt: serverTimestamp(), archived:false };
    if(note) payload.note = note;
    await setDoc(doc(db,'employees',uid), payload);
    return { ok:true, password, emailSent, realEmail: useRealEmail ? email : null };
  }catch(e){
    console.error(e);
    return { ok:false };
  }
}
async function archiveRosterEmployee(id){
  try{ await updateDoc(doc(db,'employees',id), {archived:true}); return true; }
  catch(e){ console.error(e); return false; }
}
async function restoreRosterEmployee(id){
  try{ await updateDoc(doc(db,'employees',id), {archived:false}); return true; }
  catch(e){ console.error(e); return false; }
}

/* ---------------- توست ---------------- */
function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' '+type : '');
  const icon = type==='success' ? 'fa-circle-check' : type==='error' ? 'fa-triangle-exclamation' : 'fa-circle-info';
  el.innerHTML = `<i class="fa-solid ${icon}"></i><span>${escapeHtml(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.3s'; setTimeout(()=>el.remove(),300); }, 3200);
}

/* ---------------- التنقّل ---------------- */
function goLanding(){
  state.view='landing'; state.employeeId=null; state.employeeName=null; state.currentDocId=null; state.modal=null;
  state.pickerQuery=''; state.pickerSelectedId=null; state.pickerSelectedName='';
  stopDocListeners();
  if(auth.currentUser){ signOut(auth).catch(()=>{}); }
  render();
}
function goManagerLogin(){
  if(auth.currentUser){ goManagerHome(); return; }
  state.view='managerLogin'; state.formError='';
  render();
}
function goManagerHome(){
  state.view='managerHome'; state.modal=null; state.loading=true;
  render();
  attachDocsListener();
  attachArchivedDocsListener();
}
function goEmployeeLogin(){
  state.view='employeeLogin'; state.formError='';
  state.pickerQuery=''; state.pickerSelectedId=null; state.pickerSelectedName='';
  render();
}
function goEmployeeHome(){
  state.view='employeeHome'; state.loading=true;
  render();
  attachDocsListener();
}
function openDocDetail(id){
  state.currentDocId = id; state.view='managerDetail';
  render();
}

/* ---------------- عرض الواجهة ---------------- */
function safeRender(){
  if(state.modal) return;
  if(animatingIds.size > 0) return;
  render();
}

function render(){
  const app = document.getElementById('app');
  let html = '';
  if(state.view!=='landing' && state.view!=='managerLogin') html += renderTopbar();
  if(!state.storageOk){
    html += `<div class="banner error"><i class="fa-solid fa-plug-circle-xmark"></i> تعذّر الاتصال بقاعدة البيانات حالياً. لن تُفقد أي بيانات محفوظة مسبقاً — يُرجى التحقق من الاتصال بالإنترنت، وسيُعاد الاتصال تلقائياً فور توفره.</div>`;
  }
  if(state.view==='landing') html += renderLanding();
  else if(state.view==='managerLogin') html += renderManagerLogin();
  else if(state.view==='employeeLogin') html += renderEmployeeLogin();
  else if(state.view==='employeeSignatureSetup') html += renderSignatureSetup();
  else if(state.view==='employeeHome') html += renderEmployeeHome();
  else if(state.view==='managerHome') html += renderManagerHome();
  else if(state.view==='managerDetail') html += renderManagerDetail();

  if(state.modal==='addDoc') html += renderAddDocModal();
  if(state.modal==='editOrg') html += renderEditOrgModal();
  if(state.modal==='roster') html += renderRosterModal();
  if(state.modal==='archivedDocs') html += renderArchivedDocsModal();
  if(state.modal==='weeklyReport') html += renderWeeklyReportModal();
  if(state.modal==='changePassword') html += renderChangePasswordModal();

  app.innerHTML = html;
  afterRender();
}

function renderTopbar(){
  const roleLabel = state.view.startsWith('manager') ? 'واجهة المديرة' : `الموظفة: ${escapeHtml(state.employeeName||'')}`;
  return `
  <div class="topbar">
    <div class="brand">
      <div class="brand-seal"><i class="fa-solid fa-stamp"></i></div>
      <div class="brand-text">
        <div class="org-name">${escapeHtml(state.orgName)}
          ${state.view.startsWith('manager') ? `<button class="edit-org-btn" onclick="openEditOrg()" title="تعديل اسم الجهة"><i class="fa-solid fa-pen"></i></button>` : ''}
        </div>
        <div class="sub">${roleLabel}</div>
      </div>
    </div>
    <div class="topbar-actions">
      ${state.view.startsWith('manager') ? `<button class="labeled-btn" onclick="openRoster()"><i class="fa-solid fa-users-gear"></i><span class="btn-text">إدارة الموظفات</span></button><button class="labeled-btn" onclick="openArchivedDocs()"><i class="fa-solid fa-box-archive"></i><span class="btn-text">أرشيف التعاميم</span></button><button class="labeled-btn" onclick="openWeeklyReport()"><i class="fa-solid fa-calendar-week"></i><span class="btn-text">تقرير أسبوعي</span></button>` : ''}
      ${state.view==='employeeHome' ? `<button class="labeled-btn" onclick="openUpdateSignature()"><i class="fa-solid fa-signature"></i><span class="btn-text">تحديث توقيعي</span></button><button class="labeled-btn" onclick="openChangePassword()"><i class="fa-solid fa-key"></i><span class="btn-text">تغيير كلمة المرور</span></button>` : ''}
      <div class="sync-status">
        <span class="sync-dot ${state.storageOk?'':'bad'}"></span>
        ${state.storageOk ? 'متصلة مباشرةً' : 'غير متصلة'}
      </div>
      <button class="logout-btn" onclick="goLanding()"><i class="fa-solid fa-arrow-right-from-bracket"></i> خروج</button>
    </div>
  </div>`;
}

/* ---------------- الصفحة الرئيسية ---------------- */
function renderLanding(){
  return `
  <div class="landing">
    <div class="landing-seal"><i class="fa-solid fa-stamp"></i></div>
    <h1>منصة التعاميم والتوقيعات</h1>
    <p class="lead">نظام إلكتروني لعرض التعاميم والمستندات الرسمية وتوقيع الاطّلاع عليها، مع سجلّ موثّق لكل توقيع.</p>
    <div class="role-grid">
      <div class="role-card" onclick="goManagerLogin()">
        <i class="fa-solid fa-user-tie"></i>
        <h3>مديرة / مُدخلة بيانات</h3>
        <p>إضافة التعاميم ومتابعة من وقّعت عليها، وإصدار تقارير التوقيع.</p>
      </div>
      <div class="role-card" onclick="goEmployeeLogin()">
        <i class="fa-solid fa-user-pen"></i>
        <h3>موظفة</h3>
        <p>تصفّح التعاميم غير الموقّعة والتوقيع عليها باختيار اسمك من القائمة.</p>
      </div>
    </div>
  </div>`;
}

/* ---------------- دخول الموظفة: اختيار من قائمة معتمدة ---------------- */
function renderEmployeeLogin(){
  const q = state.pickerQuery.trim();
  let results = [];
  if(q.length >= 1 && !state.pickerSelectedId){
    results = state.roster.filter(e => e.name && !e.archived && e.name.includes(q)).slice(0,8);
  }
  const showResults = q.length >= 1 && !state.pickerSelectedId;

  return `
  <div class="center-card">

/* ---------------- إعداد صورة التوقيع (إجباري أول دخول) ---------------- */
let pendingSignatureDataUrl = null;

function renderSignatureSetup(){
  const isUpdate = state.signatureUpdateMode;
  return `
  <div class="center-card" style="max-width:460px;">
    <i class="fa-solid fa-signature top-icon"></i>
    <h2>${isUpdate ? 'تحديث صورة توقيعك' : 'أضيفي صورة توقيعك'}</h2>
    <p>صوّري توقيعك بخط يدك على ورقة بيضاء فارغة، بإضاءة واضحة، ثم ارفعي الصورة هنا. ${isUpdate ? '' : 'هذه خطوة إجبارية قبل الدخول لأول مرة، وستظهر صورة توقيعك بدلاً من علامة الاطّلاع في تقارير التوقيع.'}</p>
    <div class="field">
      <label>صورة التوقيع</label>
      <input type="file" id="sigFileInput" accept="image/*" capture="environment" onchange="onSignatureFileSelected(this)">
      <div class="hint">يُفضَّل خط واضح بحبر داكن على ورقة بيضاء نظيفة، بدون أي كتابة أخرى حولها.</div>
    </div>
    <div id="sigPreviewWrap" style="display:none; margin:6px 0 18px; border:1px dashed var(--paper-line); border-radius:10px; padding:14px; background:#fff;">
      <img id="sigPreview" style="max-width:100%; max-height:140px; display:block; margin:0 auto;">
    </div>
    <button class="btn btn-primary" id="saveSigBtn" onclick="submitSignatureSetup()" disabled>
      <i class="fa-solid fa-check"></i> حفظ التوقيع
    </button>
    ${isUpdate ? `<button class="btn btn-ghost" style="margin-top:10px;" onclick="cancelSignatureUpdate()">إلغاء</button>` : ''}
  </div>`;
}

function onSignatureFileSelected(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!file.type || !file.type.startsWith('image/')){
    toast('يرجى اختيار ملف صورة صالح', 'error');
    return;
  }
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW = 360, maxH = 140;
      let w = img.width, h = img.height;
      const ratio = Math.min(maxW / w, maxH / h, 1);
      w = Math.max(1, Math.round(w * ratio));
      h = Math.max(1, Math.round(h * ratio));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      pendingSignatureDataUrl = canvas.toDataURL('image/jpeg', 0.7);
      const wrap = document.getElementById('sigPreviewWrap');
      const preview = document.getElementById('sigPreview');
      if(preview) preview.src = pendingSignatureDataUrl;
      if(wrap) wrap.style.display = 'block';
      const saveBtn = document.getElementById('saveSigBtn');
      if(saveBtn) saveBtn.disabled = false;
    };
    img.onerror = ()=> toast('تعذّر قراءة هذه الصورة، جرّبي صورة أخرى', 'error');
    img.src = e.target.result;
  };
  reader.onerror = ()=> toast('تعذّر قراءة الملف، حاولي مجدداً', 'error');
  reader.readAsDataURL(file);
}

async function submitSignatureSetup(){
  if(!pendingSignatureDataUrl){
    toast('يرجى اختيار صورة التوقيع أولاً', 'error');
    return;
  }
  const btn = document.getElementById('saveSigBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جارٍ الحفظ...'; }
  try{
    await setDoc(doc(db,'employees', state.employeeId), {signatureImage: pendingSignatureDataUrl}, {merge:true});
    pendingSignatureDataUrl = null;
    state.signatureUpdateMode = false;
    toast('تم حفظ توقيعك بنجاح', 'success');
    goEmployeeHome();
  }catch(e){
    console.error(e);
    toast('تعذّر حفظ التوقيع بسبب مشكلة اتصال. حاولي مرة أخرى.', 'error');
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-check"></i> حفظ التوقيع'; }
  }
}

function setAttachMode(mode){
  document.querySelectorAll('.attach-opt').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.mode===mode);
  });
  const linkWrap = document.getElementById('attachLinkWrap');
  if(linkWrap) linkWrap.style.display = (mode==='link') ? 'block' : 'none';
  const hidden = document.getElementById('f_attachMode');
  if(hidden) hidden.value = mode;
}

function resolveImageUrl(url){
  if(!url) return '';
  url = url.trim();
  // تحويل روابط مشاركة جوجل درايف العادية إلى صيغة عرض مباشر
  const driveMatch = url.match(/drive\.google\.com\/file\/d\/([^/]+)/) || url.match(/[?&]id=([^&]+)/);
  if(driveMatch && driveMatch[1] && url.includes('drive.google.com')){
    return `https://drive.google.com/uc?export=view&id=${driveMatch[1]}`;
  }
  return url;
}

async function submitAddDoc(){
  const entryDate = document.getElementById('f_entryDate').value;
  const docNumber = document.getElementById('f_docNumber').value.trim();
  const docType = document.getElementById('f_docType').value;
  const docDate = document.getElementById('f_docDate').value;
  const source = document.getElementById('f_source').value.trim();
  const subject = document.getElementById('f_subject').value.trim();
  const attachMode = (document.getElementById('f_attachMode').value || 'none');
  const imageUrlRaw = document.getElementById('f_imageUrl').value.trim();

  if(!entryDate || !docDate || !subject || !docNumber){
    state.formError = 'يرجى تعبئة رقم التعميم وتاريخ الإدخال وتاريخ المستند وحقل "بشأن" على الأقل.';
    render();
    return;
  }
  if(attachMode === 'link' && !imageUrlRaw){
    state.formError = 'يرجى إدخال رابط المستند، أو اختيار "بدون" أو "مرفق في قروب الواتساب".';
    render();
    return;
  }
  const btn = document.getElementById('saveDocBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جارٍ الحفظ...';

  const payload = { entryDate, entryDay: arDayName(entryDate), docNumber, docType, docDate, source, subject };
  if(attachMode === 'link' && imageUrlRaw){
    payload.attachmentType = 'link';
    payload.imageUrl = resolveImageUrl(imageUrlRaw);
  }else if(attachMode === 'whatsapp'){
    payload.attachmentType = 'whatsapp';
  }

  const isEdit = !!state.editingDocId;
  const ok = isEdit ? await editDocument(state.editingDocId, payload) : await createDoc(payload);

  if(ok){
    state.modal = null;
    state.editingDocId = null;
    toast(isEdit ? 'تم حفظ التعديلات بنجاح' : 'تم إضافة التعميم بنجاح', 'success');
    render();
  }else{
    state.formError = isEdit
      ? 'تعذّر حفظ التعديلات بسبب مشكلة في الاتصال بقاعدة البيانات. لم تُفقد بياناتك — أعيدي المحاولة الآن.'
      : 'تعذّر حفظ التعميم بسبب مشكلة في الاتصال بقاعدة البيانات. لم تُفقد بياناتك — أعيدي المحاولة الآن.';
    render();
  }
}

function dismissNewEmployeePanel(){ state.newEmployeeCreated = null; render(); }

function downloadPasswordsExcel(){
  if(!window.XLSX){
    toast('تعذّر تحميل مكتبة إنشاء ملفات Excel. تأكدي من اتصالك بالإنترنت وحاولي مجدداً.', 'error');
    return;
  }
  if(!state.sessionPasswords.length) return;
  const rows = state.sessionPasswords.map(p => ({
    'الاسم': p.name,
    'الملاحظة': p.note || '',
    'كلمة المرور': p.password,
    'تاريخ الإنشاء': formatTimeAr(p.createdAt.toISOString()),
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:24},{wch:16},{wch:16},{wch:22}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'كلمات المرور');
  const filename = `كلمات-مرور-الموظفات-${todayISO()}.xlsx`;
  XLSX.writeFile(wb, filename);
  toast('تم تنزيل الملف بنجاح', 'success');
}
async function submitAddEmployee(){
  const name = document.getElementById('r_name').value.trim();
  const note = document.getElementById('r_note').value.trim();
  const realEmailRaw = document.getElementById('r_email').value.trim();
  if(name.split(/\s+/).filter(Boolean).length < 3){
    state.formError = 'يرجى إدخال الاسم الثلاثي كاملاً للموظفة.';
    render();
    return;
  }
  if(realEmailRaw && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(realEmailRaw)){
    state.formError = 'صيغة البريد الإلكتروني غير صحيحة. تأكدي منه أو اتركي الحقل فارغاً.';
    render();
    return;
  }
  if(realEmailRaw){
    const domainTypoFix = findEmailDomainTypo(realEmailRaw);
    if(domainTypoFix){
      state.formError = `يبدو أن هناك خطأ إملائي بنطاق البريد. هل تقصدين "${domainTypoFix}"؟ صححيه ثم أعيدي الضغط على الإضافة، أو اتركي الحقل فارغاً إن كان هذا مقصوداً.`;
      render();
      return;
    }
  }
  const btn = document.getElementById('addEmpBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
  const result = await addRosterEmployee(name, note, realEmailRaw);
  if(result.ok){
    state.formError = '';
    if(result.emailSent){
      state.newEmployeeCreated = { name, emailSent:true, realEmail: result.realEmail };
      toast('تم إنشاء الحساب وإرسال رابط تعيين كلمة المرور', 'success');
    }else{
      state.newEmployeeCreated = { name, emailSent:false, password: result.password };
      state.sessionPasswords.push({ name, note, password: result.password, createdAt: new Date() });
      if(realEmailRaw){
        toast('تم إنشاء الحساب، لكن تعذّر إرسال الإيميل — استخدمي كلمة المرور الظاهرة يدوياً', 'error');
      }else{
        toast('تم إنشاء حساب الموظفة بنجاح', 'success');
      }
    }
    render();
  }else{
    state.formError = 'تعذّر إنشاء الحساب، حاولي مجدداً.';
    render();
  }
}
async function confirmArchiveRosterEmployee(id){

/* ---------------- تغيير كلمة المرور (الموظفة) ---------------- */
function openChangePassword(){ state.modal='changePassword'; state.formError=''; render(); }
function renderChangePasswordModal(){
  return `
  <div class="overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal" style="max-width:400px;">
      <div class="modal-head">
        <h3><i class="fa-solid fa-key"></i> تغيير كلمة المرور</h3>
        <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      ${state.formError ? `<div class="banner error"><i class="fa-solid fa-circle-exclamation"></i> ${escapeHtml(state.formError)}</div>` : ''}
      <div class="field">
        <label>كلمة المرور الجديدة</label>
        <input type="password" id="cp_new" placeholder="٦ أحرف على الأقل" autocomplete="off">
      </div>
      <div class="field">
        <label>تأكيد كلمة المرور الجديدة</label>
        <input type="password" id="cp_confirm" placeholder="أعيدي كتابتها" autocomplete="off">
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
        <button class="btn btn-primary" id="cpBtn" onclick="submitChangePassword()"><i class="fa-solid fa-check"></i> حفظ</button>
      </div>
    </div>
  </div>`;
}
async function submitChangePassword(){
  const p1 = document.getElementById('cp_new').value;
  const p2 = document.getElementById('cp_confirm').value;
  if(!p1 || p1.length < 6){
    state.formError = 'يجب ألا تقل كلمة المرور عن ٦ أحرف.';
    render();
    return;
  }
  if(p1 !== p2){
    state.formError = 'كلمتا المرور غير متطابقتين.';
    render();
    return;
  }
  const btn = document.getElementById('cpBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
  try{
    await updatePassword(auth.currentUser, p1);
    state.modal = null;
    toast('تم تغيير كلمة المرور بنجاح', 'success');
    render();
  }catch(e){
    console.error(e);
    if(e.code === 'auth/requires-recent-login'){
      state.formError = 'لأسباب أمنية، يرجى تسجيل الخروج ثم الدخول مرة أخرى قبل تغيير كلمة المرور.';
    }else{
      state.formError = 'تعذّر تغيير كلمة المرور، حاولي مجدداً.';
    }
    render();
  }
}


/* ---------------- تفاصيل التعميم (المديرة) ---------------- */
function renderManagerDetail(){
  const doc_ = docById(state.currentDocId);
  if(!doc_){
    return `<div class="empty-state"><i class="fa-solid fa-file-circle-question"></i><p>هذا التعميم لم يعد متاحاً.</p>
      <button class="btn btn-ghost" style="width:auto;" onclick="goManagerHome()">العودة للسجلّ</button></div>`;
  }
  const signerRows = doc_.signatures.length ? doc_.signatures.map(s=>{
    const emp = state.roster.find(e=>e.id===s.employeeId);
    const sealContent = (emp && emp.signatureImage)
      ? `<img src="${escapeHtml(emp.signatureImage)}" style="max-width:100%; max-height:100%; object-fit:contain;" alt="توقيع">`
      : `<i class="fa-solid fa-check"></i>`;
    return `
    <div class="signer-row">
      <div class="signer-seal">${sealContent}</div>
      <div class="signer-name">${escapeHtml(s.employeeName)}</div>
      <div class="signer-time">${escapeHtml(formatTimeAr(s.signedAt))}</div>
    </div>`;
  }).join('') : `<div style="color:var(--ink-faint); font-size:13px; padding:10px 0;">لا توجد توقيعات على هذا التعميم حتى الآن.</div>`;

  return `
  <button class="back-link" onclick="goManagerHome()"><i class="fa-solid fa-arrow-right"></i> العودة إلى سجلّ التعاميم</button>
  <div class="detail-header">
    <div class="field-label-inline"><i class="fa-solid fa-file-lines"></i> بشأن</div>
    <div class="detail-title">${escapeHtml(doc_.subject)}</div>
    ${doc_.imageUrl ? `
    <div class="circular-image-wrap" style="max-width:340px;">
      <img src="${escapeHtml(doc_.imageUrl)}" alt="صورة التعميم" loading="lazy"
           onclick="window.open('${escapeHtml(doc_.imageUrl)}','_blank')"
           onerror="this.closest('.circular-image-wrap').innerHTML='<a href=&quot;${escapeHtml(doc_.imageUrl)}&quot; target=&quot;_blank&quot; class=&quot;image-fallback-link&quot;><i class=&quot;fa-solid fa-image&quot;></i> تعذّر عرض الصورة هنا — اضغطي لفتحها في نافذة جديدة</a>'">
    </div>` : ''}
    ${doc_.attachmentType === 'whatsapp' ? `
    <div class="whatsapp-attach-note"><i class="fa-brands fa-whatsapp"></i> المستند الأصلي مرفق في قروب الواتساب</div>` : ''}
    <div class="meta-grid">
      <div class="meta-item"><div class="k">اليوم</div><div class="v">${escapeHtml(arDayName(doc_.entryDate))}</div></div>
      <div class="meta-item"><div class="k">رقم التعميم</div><div class="v">${escapeHtml(doc_.docNumber || '—')}</div></div>
      <div class="meta-item"><div class="k">تاريخ الإدخال</div><div class="v">${escapeHtml(formatDateAr(doc_.entryDate))}</div></div>
      <div class="meta-item"><div class="k">نوع المستند</div><div class="v">${escapeHtml(doc_.docType)}</div></div>
      <div class="meta-item"><div class="k">تاريخ المستند</div><div class="v">${escapeHtml(formatDateAr(doc_.docDate))}</div></div>
      <div class="meta-item"><div class="k">جهة الورود</div><div class="v">${escapeHtml(doc_.source || '—')}</div></div>
      <div class="meta-item"><div class="k">عدد التوقيعات</div><div class="v">${doc_.signatures.length}</div></div>
    </div>
    <div class="detail-actions">
      <button class="btn btn-ghost" onclick="openEditDoc('${doc_.id}')"><i class="fa-solid fa-pen"></i> تعديل التعميم</button>
      <button class="btn btn-primary" onclick="printDocReport('${doc_.id}')"><i class="fa-solid fa-print"></i> طباعة / حفظ PDF</button>
      ${doc_.archived
        ? `<button class="btn btn-ghost" onclick="confirmRestoreDoc('${doc_.id}')"><i class="fa-solid fa-rotate-left"></i> استرجاع التعميم</button>`
        : `<button class="btn btn-ghost" onclick="confirmArchive('${doc_.id}')"><i class="fa-solid fa-box-archive"></i> أرشفة التعميم</button>`}
    </div>
  </div>
  <div class="sign-list">
    <h3><i class="fa-solid fa-signature"></i> الموظفات اللاتي وقّعن (${doc_.signatures.length})</h3>
    ${signerRows}
  </div>`;
}

/* ---------------- واجهة الموظفة ---------------- */
function renderEmployeeHome(){
  const nameChip = `<div class="emp-name-chip"><i class="fa-solid fa-user"></i> ${escapeHtml(state.employeeName)}</div>`;
  if(state.loading){
    return `<div class="emp-topinfo">${nameChip}</div>` + renderSkeleton(2);
  }
  const pending = employeeUnsignedDocs();
  let body;
  if(pending.length===0){
    body = `
    <div class="all-signed">
      <i class="fa-solid fa-circle-check"></i>
      <h3>لا توجد تعاميم بانتظار توقيعك</h3>
      <p>أنتِ على اطّلاع بكل التعاميم المتاحة حالياً.</p>
    </div>`;
  }else{
    body = pending.map(d=>`
      <div class="circular-card" id="card_${d.id}">
        <div class="stamp-overlay"><div class="stamp-graphic"><i class="fa-solid fa-check"></i><span>تم التوقيع</span></div></div>
        <div class="top-row">
          <span class="doc-type-tag"><i class="fa-solid fa-file-lines"></i> ${escapeHtml(d.docType)}</span>
          <span class="doc-date-tag">${escapeHtml(formatDateAr(d.docDate))}</span>
        </div>
        <div class="field-label-inline"><i class="fa-solid fa-file-signature"></i> بشأن</div>
        <div class="subject">${escapeHtml(d.subject)}</div>
        ${d.imageUrl ? `
        <div class="circular-image-wrap">
          <img src="${escapeHtml(d.imageUrl)}" alt="صورة التعميم" loading="lazy"
               onclick="window.open('${escapeHtml(d.imageUrl)}','_blank')"
               onerror="this.closest('.circular-image-wrap').innerHTML='<a href=&quot;${escapeHtml(d.imageUrl)}&quot; target=&quot;_blank&quot; class=&quot;image-fallback-link&quot;><i class=&quot;fa-solid fa-image&quot;></i> تعذّر عرض الصورة هنا — اضغطي لفتحها في نافذة جديدة</a>'">
        </div>` : ''}
        ${d.attachmentType === 'whatsapp' ? `
        <div class="whatsapp-attach-note"><i class="fa-brands fa-whatsapp"></i> المستند الأصلي مرفق في قروب الواتساب</div>` : ''}
        <div class="circular-meta">
          <span><i class="fa-solid fa-calendar-day"></i> ${escapeHtml(arDayName(d.entryDate))} ${escapeHtml(formatDateAr(d.entryDate))}</span>
          ${d.source ? `<span><i class="fa-solid fa-inbox"></i> ${escapeHtml(d.source)}</span>` : ''}
        </div>
        <button class="sign-cta" id="signBtn_${d.id}" onclick="handleSign('${d.id}')">
          <i class="fa-solid fa-stamp"></i> أوقّع على المستند أعلاه وأقرّ أنّي قد اطّلعت عليه وقرأته
        </button>
      </div>`).join('');
  }
  return `<div class="emp-topinfo">${nameChip}<span style="font-size:12.5px; color:var(--ink-faint);">${pending.length} تعميم بانتظار التوقيع</span></div>${body}`;
}

async function handleSign(docId){
  const btn = document.getElementById('signBtn_'+docId);
  const card = document.getElementById('card_'+docId);
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جارٍ التوقيع...'; }
  animatingIds.add(docId);

  const ok = await signDocument(docId, state.employeeId, state.employeeName);

  if(ok){
    if(card) card.classList.add('stamping');
    toast('تم توثيق توقيعك بنجاح', 'success');
    setTimeout(()=>{ animatingIds.delete(docId); render(); }, 950);
  }else{
    animatingIds.delete(docId);
    toast('تعذّر حفظ التوقيع بسبب مشكلة اتصال. لم يُسجَّل أي شيء بعد — حاولي مرة أخرى.', 'error');
    if(btn){ btn.disabled=false; btn.innerHTML = '<i class="fa-solid fa-stamp"></i> أوقّع على المستند أعلاه وأقرّ أنّي قد اطّلعت عليه وقرأته'; }
  }
}

/* ---------------- تقرير الطباعة ---------------- */
function printDocReport(docId){
  const doc_ = docById(docId);
  if(!doc_) return;

  // الجدول الأول: بيانات التعميم (صف عناوين + صف بيانات واحد)
  const infoTable = `
    <table class="print-table">
      <thead><tr>
        <th>تاريخ التعميم</th><th>رقمه</th><th>جهة الورود</th><th>بشأن</th><th>عدد الموقّعات</th>
      </tr></thead>
      <tbody><tr>
        <td>${escapeHtml(formatDateAr(doc_.docDate))}</td>
        <td>${escapeHtml(doc_.docNumber || '—')}</td>
        <td>${escapeHtml(doc_.source || '—')}</td>
        <td>${escapeHtml(doc_.subject)}</td>
        <td style="text-align:center;">${doc_.signatures.length}</td>
      </tr></tbody>
    </table>`;

  // الجدول الثاني: كل الموظفات المعتمدات، وتظهر أمام الموقّعات منهن علامة التوقيع ووقته
  // الموظفات النشطات يظهرن دائماً (حتى بدون توقيع، لمتابعة من لم توقّع بعد)
  // أما المؤرشفات فيظهرن فقط إذا كان لهن توقيع سابق على هذا التعميم تحديداً،
  // حتى لا يضيع أي سجل توقيع تاريخي مهما تغيّرت حالة الموظفة لاحقاً
  const rosterList = state.roster.filter(emp =>
    !emp.archived || doc_.signatures.some(s => s.employeeId === emp.id)
  );
  const empRows = rosterList.length ? rosterList.map((emp,i)=>{
    const sig = doc_.signatures.find(s => s.employeeId === emp.id);
    return `<tr>
      <td>${i+1}</td>
      <td>${escapeHtml(emp.name)}</td>
      <td style="text-align:center;">${sig
        ? (emp.signatureImage
            ? `<img src="${escapeHtml(emp.signatureImage)}" style="max-height:60px; max-width:220px; display:block; margin:0 auto;" alt="توقيع">`
            : `✔ ${escapeHtml(formatTimeAr(sig.signedAt))}`)
        : ''}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="3" style="text-align:center; color:#777;">لا توجد موظفات في القائمة حالياً</td></tr>`;

  const empTable = `
    <table class="print-table" style="margin-top:22px;">
      <thead><tr><th style="width:40px;">م</th><th>اسم الموظفة</th><th style="width:240px;">التوقيع</th></tr></thead>
      <tbody>${empRows}</tbody>
    </table>`;

  const html = `
    <div class="print-header">
      <div class="org">${escapeHtml(state.orgName)}<br><span style="font-weight:400; font-size:11px;">تقرير توقيعات تعميم</span></div>

/* ---------------- ربط ما بعد الرسم ---------------- */
function afterRender(){
  const empInput = document.getElementById('empSearchInput');
  if(empInput && !state.pickerSelectedId){
    empInput.focus();
  }
  const mgrEmail = document.getElementById('mgrEmail');
  const mgrPassword = document.getElementById('mgrPassword');
  if(mgrEmail){
    mgrEmail.focus();
    mgrEmail.addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('mgrPassword').focus(); });
  }
  if(mgrPassword){
    mgrPassword.addEventListener('keydown', e=>{ if(e.key==='Enter') submitManagerLogin(); });
  }
}

/* ---------------- التهيئة ---------------- */
window.addEventListener('online', ()=>{ state.storageOk=true; safeRender(); });
window.addEventListener('offline', ()=>{ state.storageOk=false; safeRender(); });

function tryResumeEmployeeSession(){
  const user = auth.currentUser;
  if(!user || user.email === MANAGER_EMAIL) return;
  if(state.employeeId) return; // جلسة موظفة نشطة مسبقاً
  if(state.view!=='landing' && state.view!=='employeeLogin') return;
  const emp = state.roster.find(e=>e.id===user.uid);
  if(emp && emp.archived){
    signOut(auth).catch(()=>{});
    return;
  }
  if(emp){
    state.employeeId = emp.id;
    state.employeeName = emp.name;
    if(!emp.signatureImage){
      state.view = 'employeeSignatureSetup';
      render();
    }else{
      goEmployeeHome();
    }
  }
}

attachOrgListener();
attachRosterListener();
onAuthStateChanged(auth, (user)=>{
  if(!user){
    if(state.view==='managerHome' || state.view==='managerDetail' || state.view==='employeeHome'){
      goLanding();
    }
    return;
  }
  if(user.email !== MANAGER_EMAIL){
    tryResumeEmployeeSession();
  }
});
render();
